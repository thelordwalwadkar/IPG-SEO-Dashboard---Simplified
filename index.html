<style>
:root{--bg:#f6f7f9;--card:#fff;--ink:#14181f;--mute:#6b7585;--line:#dfe3e9;--acc:#2563c9;--bad:#b3261e}

*{box-sizing:border-box}
body{margin:0;min-height:100vh;display:grid;place-items:center;background:var(--bg);color:var(--ink);font:15px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;padding:16px}
form{width:100%;max-width:360px;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:24px;display:grid;gap:14px}

label{display:grid;gap:5px;font-size:13px;color:var(--mute)}
input{font:inherit;padding:10px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--ink)}
input:focus-visible,button:focus-visible{outline:2px solid var(--acc);outline-offset:1px}
button{font:inherit;font-weight:600;padding:10px;border:0;border-radius:8px;background:var(--acc);color:#fff;cursor:pointer}
button:disabled{opacity:.6;cursor:wait}
#err{color:var(--bad);font-size:13px;min-height:18px}
</style>

const b64=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0));
async function open(id,pw){
 const base=await crypto.subtle.importKey('raw',new TextEncoder().encode(id+':'+pw),'PBKDF2',false,['deriveKey']);
 const key=await crypto.subtle.deriveKey({name:'PBKDF2',salt:b64(PAYLOAD.s),iterations:PAYLOAD.n,hash:'SHA-256'},base,{name:'AES-GCM',length:256},false,['decrypt']);
 const buf=await crypto.subtle.decrypt({name:'AES-GCM',iv:b64(PAYLOAD.i)},key,b64(PAYLOAD.d));
 return new TextDecoder().decode(buf);
}
function show(html){document.open();document.write(html);document.close()}
document.getElementById('f').addEventListener('submit',async e=>{
 e.preventDefault();const btn=document.getElementById('go'),err=document.getElementById('err');
 err.textContent='';btn.disabled=true;btn.textContent='Checking…';
 try{
  if(!window.crypto||!crypto.subtle)throw new Error('secure');
  const id=document.getElementById('u').value.trim(),pw=document.getElementById('p').value;
  show(await open(id,pw));
 }catch(x){
  err.textContent=x.message==='secure'?'This page must be opened over https.':'Wrong ID or password.';
  btn.disabled=false;btn.textContent='Sign in';
 }
});
